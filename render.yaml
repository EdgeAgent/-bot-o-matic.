services:
  # Backend Service
  - type: web
    name: bot-o-matic-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_PATH
        value: /app/data/botomatic.db
      - key: DEFAULT_LLM_PROVIDER
        value: openai
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DEFAULT_OPENAI_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGIN
        fromService:
          type: web
          name: bot-o-matic-frontend
          property: url
    disk:
      name: bot-o-matic-data
      mountPath: /app/data
      sizeGB: 1

  # Frontend Service
  - type: web
    name: bot-o-matic-frontend
    env: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: bot-o-matic-backend
          property: url
      - key: NEXT_PUBLIC_DEMO_MODE
        value: "false"
      - key: NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
